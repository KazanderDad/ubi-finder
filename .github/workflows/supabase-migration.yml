name: Supabase Database Migration & Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-migration.yml'
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Database Migrations & Deploy Functions
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error title=Missing Secrets::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD secret is not populated in GitHub Actions secrets."
            exit 1
          fi
          echo "Supabase secrets found and loaded."

      - name: Link to Supabase Project
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID || 'oinubdnkqnifeaaejmjl' }}" --password "$SUPABASE_DB_PASSWORD"

      - name: Push Database Migrations
        run: |
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy notify-new-submission --project-ref "${{ vars.SUPABASE_PROJECT_ID || 'oinubdnkqnifeaaejmjl' }}" --no-verify-jwt

