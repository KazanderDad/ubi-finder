name: Supabase Database Migration & Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-migration.yml'
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Database Migrations & Deploy Functions
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Check Secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error title=Missing Supabase configuration::SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, and SUPABASE_PROJECT_ID must be configured in the Production environment."
            exit 1
          fi
          echo "Supabase secrets found and loaded."

      - name: Link to Supabase Project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push Database Migrations
        run: |
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy All Edge Functions
        run: |
          for func_dir in supabase/functions/*; do
            if [ -d "$func_dir" ]; then
              func_name=$(basename "$func_dir")
              echo "Deploying Edge Function: $func_name"
              supabase functions deploy "$func_name" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
            fi
          done
